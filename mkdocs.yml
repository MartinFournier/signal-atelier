site_name: Signal Atelier
site_description: Player and maintainer guide for the Signal Atelier modpack
site_url: https://dev.mfournier.com/signal-atelier/
repo_url: https://github.com/MartinFournier/signal-atelier
repo_name: MartinFournier/signal-atelier
edit_uri: ""

theme:
  name: mkdocs
  favicon: assets/images/signal-icon.png
  color_mode: dark
  user_color_mode_toggle: true
  nav_style: dark
  navigation_depth: 3

extra_css:
  - assets/stylesheets/signal-atelier.css

extra_javascript:
  - assets/javascripts/sortable-tables.js

nav:
  - Home: index.md
  - Player guide:
      - Install: guide/install.md
      - First launch: guide/first-launch.md
      - Engineering notebook: guide/progression.md
  - Project reference:
      - Current status: status.md
      - Mod catalog: reference/mods.md
      - Generated pack reference: reference/pack.md
      - Pack decisions: decisions.md
      - Test plan: test-plan.md
      - Roadmap: roadmap.md

strict: true
