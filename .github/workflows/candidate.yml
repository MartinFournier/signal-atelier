name: Candidate artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build verified candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.16
          enable-cache: true

      - name: Validate and package candidate
        run: scripts/check.sh

      - name: Build documentation
        run: scripts/check-docs.sh

      - name: Verify candidate checksum
        working-directory: dist
        run: sha256sum --check signal-atelier-0.3.0.mrpack.sha256

      - name: Upload candidate and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signal-atelier-candidate-${{ github.sha }}
          path: |
            dist/signal-atelier-0.3.0.mrpack
            dist/signal-atelier-0.3.0.mrpack.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
